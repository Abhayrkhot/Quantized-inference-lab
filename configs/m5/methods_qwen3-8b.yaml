# M5: the M2 method comparison on Qwen3-8B-Base (A100 80 GB / H200; whole model on the GPU).
name: m5_methods_8b
model: Qwen/Qwen3-8B-Base
dtype: bfloat16
seqlen: 2048
batch_size: 4
offload: false
datasets: [wikitext2, c4]
runs:
  - {method: baseline}
  - sweep: {method: [rtn, gptq, awq], bits: [4, 3], granularity: [g128], symmetric: [false]}
  - {method: gptq, bits: 4, granularity: g128, symmetric: true, save: qwen3-8b/gptq-w4g128-sym.pt}
  - {method: awq, bits: 4, granularity: g128, symmetric: false, save: qwen3-8b/awq-w4g128-asym.pt}
  - {method: rtn, bits: 4, granularity: g64, fmt: nf4}
  - {method: rtn, bits: 8, granularity: channel, fmt: fp8}
  - {method: rtn, bits: 8, granularity: channel, symmetric: true, act_bits: 8, act_granularity: token}
  - {method: smoothquant, bits: 8, granularity: channel, symmetric: true, act_bits: 8, act_granularity: token, alpha: 0.5}
  - {method: baseline, kv_bits: 8, kv_mode: token}
  - {method: baseline, kv_bits: 4, kv_mode: kivi}
