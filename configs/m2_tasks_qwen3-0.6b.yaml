# M2: zero-shot accuracy (lm-eval) for the main configurations on Qwen3-0.6B-Base.
name: m2_tasks
model: Qwen/Qwen3-0.6B-Base
dtype: bfloat16
seqlen: 2048
batch_size: 4
task_batch_size: 4  # 16 needs ~770 MB of logits per batch: too much for 4 GB
offload: false
datasets: []
tasks: [arc_easy, arc_challenge, hellaswag, piqa, winogrande]
runs:
  - {method: baseline}
  - {method: rtn, bits: 4, granularity: g128, symmetric: false}
  - {method: gptq, bits: 4, granularity: g128, symmetric: false}
  - {method: awq, bits: 4, granularity: g128, symmetric: false}
  - {method: smoothquant, bits: 8, granularity: channel, symmetric: true, act_bits: 8, act_granularity: token, alpha: 0.5}
